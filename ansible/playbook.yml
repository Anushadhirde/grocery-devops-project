---
- name: Deploy Grocery Ordering App (local demo)
  hosts: app_servers
  become: false

  vars:
    image_repo: "athanusha/grocery-app"
    image_tag: "latest"
    container_name: "grocery-app"
    app_port: 5001

  tasks:
    - name: Pull the latest application image
      community.docker.docker_image:
        name: "{{ image_repo }}:{{ image_tag }}"
        source: pull
        force_source: true

    - name: Stop and remove existing container (if any)
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent

    - name: Run the Grocery App container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_repo }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "{{ app_port }}:5000"
        env:
          SECRET_KEY: "{{ app_secret_key | default('change-me-in-production') }}"

    - name: Wait for application health check to pass
      uri:
        url: "http://localhost:{{ app_port }}/health"
        status_code: 200
      register: health_result
      retries: 5
      delay: 5
      until: health_result.status == 200