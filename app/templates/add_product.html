{% extends "base.html" %}
{% block title %}Add Product - Grocery App{% endblock %}
{% block content %}
<h1 class="mb-4">Add Product</h1>
<form method="post" class="bg-white p-4 rounded shadow-sm" style="max-width: 500px;">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input type="text" name="name" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Category</label>
    <input type="text" name="category" class="form-control" placeholder="e.g. Fruits, Dairy, Bakery" value="General">
  </div>
  <div class="mb-3">
    <label class="form-label">Price (₹)</label>
    <input type="number" step="0.01" name="price" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Stock</label>
    <input type="number" name="stock" class="form-control" value="0" min="0" required>
  </div>
  <button type="submit" class="btn btn-primary">Save</button>
  <a href="{{ url_for('list_products') }}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
