{% extends "base.html" %}
{% block title %}Add Customer - Grocery App{% endblock %}
{% block content %}
<h1 class="mb-4">Add Customer</h1>
<form method="post" class="bg-white p-4 rounded shadow-sm" style="max-width: 500px;">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input type="text" name="name" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" name="email" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Address</label>
    <textarea name="address" class="form-control" rows="2"></textarea>
  </div>
  <button type="submit" class="btn btn-primary">Save</button>
  <a href="{{ url_for('list_customers') }}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
